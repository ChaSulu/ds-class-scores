name: Publish class rankings
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-class-rankings
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Materialize private class and QA roster migrations
        run: node scripts/roster.cjs build
        env:
          RANK_ROSTER_CLASS: ${{ secrets.RANK_ROSTER_CLASS }}
          RANK_ROSTER_QA: ${{ secrets.RANK_ROSTER_QA }}
      - name: Build the administration page
        run: node scripts/build-admin.cjs
        env:
          RANK_ADMIN_HASH: ${{ secrets.RANK_ADMIN_HASH }}
      - uses: w7s-io/w7s-cloud@b2beaa290a5c7975698e4677a03f8b0289896274
