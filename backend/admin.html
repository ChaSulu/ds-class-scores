<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>教学管理后台 · 数据结构模拟考</title>
<link rel="stylesheet" href="./admin.css">
</head>
<body>
<main id="loginPanel" class="login-screen">
  <section class="login-art" aria-label="数据结构模拟考">
    <div class="login-art-inner">
      <div class="login-brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>数据结构模拟考</span></div>
      <div class="login-heading"><h2>班级管理平台</h2></div>
      <figure class="tree-art" role="img" aria-label="二叉搜索树中从根节点 8 到节点 6 的查找路径"><svg viewBox="0 0 510 256" fill="none" aria-hidden="true" focusable="false">
 <g stroke="#4d7788" stroke-width="1.6"><path d="M255 39V59Q255 70 244 70H148Q137 70 137 81V100M255 59Q255 70 266 70H362Q373 70 373 81V100M137 122V149Q137 158 128 158H82Q73 158 73 167V190M137 149Q137 158 146 158H192Q201 158 201 167V190M373 122V149Q373 158 364 158H318Q309 158 309 167V190M373 149Q373 158 382 158H428Q437 158 437 167V190"/></g>
 <path d="M255 53V59Q255 70 244 70H148Q137 70 137 81V99M137 130V149Q137 158 146 158H192Q201 158 201 167V188" stroke="#64d3c2" stroke-width="2.7"/>
 <g stroke="#446577" fill="#1a3347" stroke-width="1.5"><rect x="231" y="10" width="48" height="43" rx="11" fill="#7cdfcd" stroke="#7cdfcd"/><rect x="114" y="93" width="46" height="41" rx="10" stroke="#68bfae"/><rect x="350" y="93" width="46" height="41" rx="10"/><rect x="53" y="185" width="40" height="38" rx="9"/><rect x="181" y="185" width="40" height="38" rx="9" fill="#2c605f" stroke="#7cdfcd"/><rect x="289" y="185" width="40" height="38" rx="9"/><rect x="417" y="185" width="40" height="38" rx="9"/></g>
 <g fill="#e0ebed" font-family="Consolas,monospace" font-size="18" font-weight="600" text-anchor="middle"><text x="255" y="38" fill="#143541">8</text><text x="137" y="120">4</text><text x="373" y="120">12</text><text x="73" y="210">2</text><text x="201" y="210">6</text><text x="309" y="210">10</text><text x="437" y="210">14</text></g>
</svg></figure>
    </div>
  </section>
  <section class="login-form-side"><div class="login-box">
    <h1>管理员登录</h1>
    <p class="lead">使用管理口令访问班级名单与模拟考成绩。</p>
    <form id="loginForm">
      <label for="password">管理口令</label>
      <div class="password-control"><input type="password" id="password" autocomplete="current-password" placeholder="输入管理口令" required><button type="button" id="showPassword" class="icon-button" aria-label="显示口令" aria-pressed="false"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.4-6.5 10-6.5S22 12 22 12s-3.4 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
      <p id="loginError" class="notice error" role="alert"></p>
      <button class="primary login-submit" type="submit" id="signIn">登录</button>
    </form>
  </div></section>
</main>
<div id="workspace" class="admin-shell" hidden>
  <aside id="sidebar" class="sidebar" aria-label="管理侧栏">
    <div class="side-brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><div class="brand-text"><strong>数据结构模拟考</strong><small>教学管理后台</small></div></div>
    <nav class="side-nav" aria-label="后台主导航">
      <button type="button" class="nav-item" data-view="overview"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>管理概览</span></button>
      <button type="button" class="nav-item" data-view="roster"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20v-2a4 4 0 0 1 4-4h3a4 4 0 0 1 4 4v2"/><circle cx="8.5" cy="7" r="3.5"/><path d="M16 4.2a3.5 3.5 0 0 1 0 6.6M17 14a4 4 0 0 1 4 4v2"/></svg><span>学号名单</span></button>
      <button type="button" class="nav-item" data-view="ranking"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 16V9m6 7V4m6 12v-5"/></svg><span>成绩排名</span></button>
    </nav>
    <div class="account-block"><span class="account-avatar"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><span class="account-name">管理员</span><button id="logout" type="button" class="icon-button" aria-label="退出管理" title="退出管理"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5m5-12 4 4-4 4m-7-4h11"/></svg></button></div>
  </aside>
  <button type="button" id="navBackdrop" class="nav-backdrop" aria-label="关闭导航"></button>
  <div class="main-shell">
    <header class="topbar">
      <button type="button" id="menuToggle" class="icon-button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="breadcrumbs"><span>教学管理后台</span><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg><span id="crumb">管理概览</span></div>
      <span class="class-chip"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 5l9 4.5-9 4.5-9-4.5Zm3 2v4c3.2 3.2 8.8 3.2 12 0v-4M21 10v6"/></svg><span id="classLabel">通信2491–2494</span></span>
    </header>
    <main class="content">
      <section class="page-head"><div class="page-title"><h1 id="pageTitle" tabindex="-1">管理概览</h1><p id="sectionHint"></p></div>
        <div class="page-actions"><span id="updatedAt" class="quiet"></span><button type="button" class="secondary refresh-button" id="refresh"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 0 0-13.8-4.5L3 9m0-5v5h5m-4 5a8 8 0 0 0 13.8 4.5L21 15m0 5v-5h-5"/></svg><span>刷新数据</span></button></div>
      </section>
      <p id="message" class="notice" role="status"></p>
      <section id="overview" aria-label="管理概览">
        <div class="metric-grid">
          <article class="metric-card metric-teal"><div class="metric-top"><span class="metric-label">启用学号</span><span class="metric-icon"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20v-2a4 4 0 0 1 4-4h3a4 4 0 0 1 4 4v2"/><circle cx="8.5" cy="7" r="3.5"/><path d="M16 4.2a3.5 3.5 0 0 1 0 6.6M17 14a4 4 0 0 1 4 4v2"/></svg></span></div><div class="metric-reading"><strong class="metric-value" id="metricActive">—</strong><span class="metric-unit">人</span></div></article>
          <article class="metric-card metric-blue"><div class="metric-top"><span class="metric-label">已交卷</span><span class="metric-icon"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-5"/></svg></span></div><div class="metric-reading"><strong class="metric-value" id="metricSubmitted">—</strong><span class="metric-unit">人</span></div></article>
          <article class="metric-card metric-violet"><div class="metric-top"><span class="metric-label">平均分</span><span class="metric-icon"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 17a9 9 0 1 1 17.2 0H3.4Zm8.6-3 4-5"/></svg></span></div><div class="metric-reading"><strong class="metric-value" id="metricAverage">—</strong><span class="metric-unit">分</span></div></article>
          <article class="metric-card metric-amber"><div class="metric-top"><span class="metric-label">最高分</span><span class="metric-icon"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Zm8 1h3v2a4 4 0 0 1-4 4M8 5H5v2a4 4 0 0 0 4 4m3 2v5m-4 2h8"/></svg></span></div><div class="metric-reading"><strong class="metric-value" id="metricHigh">—</strong><span class="metric-unit">分</span></div></article>
        </div>
        <div class="overview-grid">
          <section class="panel score-panel"><div class="panel-heading"><div><h2>成绩分布</h2><p>按已评分学号的最高分统计</p></div><span class="chart-unit">人数</span></div><div class="chart" id="distribution"></div></section>
          <section class="panel participation-panel"><div class="panel-heading"><div><h2>交卷进度</h2><p>当前启用学号的交卷情况</p></div></div>
            <div class="participation-body"><div class="ring" id="participationRing"><div class="ring-center"><strong id="participationPercent">—</strong><span>交卷率</span></div></div>
              <dl class="legend-list"><div class="legend-row"><dt><i class="dot submitted"></i>已交卷</dt><dd id="partSubmitted">—</dd></div><div class="legend-row"><dt><i class="dot missing"></i>未交卷</dt><dd id="partMissing">—</dd></div><div class="legend-row"><dt><i class="dot pending"></i>其中待自评</dt><dd id="partPending">—</dd></div></dl>
            </div>
          </section>
        </div>
        <section class="panel leaders-panel"><div class="panel-heading"><h2>成绩前五名</h2><button class="quiet text-link" type="button" data-view="ranking">全部排名 <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m10 6 6 6-6 6"/></svg></button></div><ol id="leaders" class="leader-list"></ol></section>
      </section>
      <section id="roster" class="panel" hidden aria-label="学号名单">
        <div class="panel-heading"><div><h2>班级名单</h2><p id="counts"></p></div><button id="add" class="primary" type="button"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>新增学号</span></button></div>
        <div class="panel-tools"><label class="search-box"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="visually-hidden">搜索学号、真实姓名或显示名</span><input type="search" id="search" placeholder="搜索学号、真实姓名或显示名" autocomplete="off"></label><label class="select-control"><span class="visually-hidden">按启用状态筛选</span><select id="filter"><option value="all">全部状态</option><option value="on">已启用</option><option value="off">已停用</option></select></label></div>
        <div class="bulk-bar" aria-label="批量管理学号">
          <label class="check-label"><input id="selectPage" type="checkbox">全选本页</label>
          <button id="selectMatches" class="quiet" type="button" hidden>选中全部筛选结果</button>
          <span id="selectionCount" role="status"></span>
          <div class="bulk-actions">
            <button type="button" data-bulk="enable" disabled>批量启用</button>
            <button type="button" data-bulk="disable" disabled>批量停用</button>
            <button type="button" data-bulk="remove" class="remove-button" disabled>批量删除</button>
            <button id="clearSelection" type="button" class="quiet" hidden>取消选择</button>
          </div>
        </div>
        <div class="table-wrap"><table aria-label="班级学号名单"><thead><tr><th scope="col">选择</th><th scope="col">学号</th><th scope="col">真实姓名</th><th scope="col">显示名</th><th scope="col">最高分</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody id="members"></tbody></table></div>
        <p class="empty" id="empty" hidden></p>
        <div class="pagination"><span id="resultCount"></span><div class="pager-controls"><label class="select-control"><span class="visually-hidden">每页行数</span><select id="pageSize"><option value="15">15 条 / 页</option><option value="30">30 条 / 页</option><option value="50">50 条 / 页</option></select></label><button id="prevPage" type="button" aria-label="名单上一页">上一页</button><span id="pageInfo"></span><button id="nextPage" type="button" aria-label="名单下一页">下一页</button></div></div>
      </section>
      <section id="ranking" class="panel" hidden aria-label="成绩排名">
        <div class="panel-heading"><div><h2>班级成绩榜</h2><p>每个启用学号取已评分的最高分，同分并列。</p></div></div>
        <div class="panel-tools"><label class="search-box"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span class="visually-hidden">搜索学号、真实姓名或显示名</span><input type="search" id="rankSearch" placeholder="搜索学号、真实姓名或显示名" autocomplete="off"></label><label class="select-control"><span class="visually-hidden">按评分状态筛选</span><select id="rankFilter"><option value="all">全部成绩</option><option value="graded">已评分</option><option value="pending">待自评</option></select></label></div>
        <div class="table-wrap"><table aria-label="班级成绩排名"><thead><tr><th scope="col">名次</th><th scope="col">学号</th><th scope="col">真实姓名</th><th scope="col">显示名</th><th scope="col">最高分</th><th scope="col">评分状态</th></tr></thead><tbody id="rankRows"></tbody></table></div>
        <p id="rankEmpty" class="empty" hidden></p>
        <div class="pagination"><span id="rankResultCount"></span><div class="pager-controls"><button id="rankPrev" type="button" aria-label="成绩上一页">上一页</button><span id="rankPageInfo"></span><button id="rankNext" type="button" aria-label="成绩下一页">下一页</button></div></div>
      </section>
    </main>
  </div>
</div>
<dialog id="editor" aria-labelledby="editTitle">
  <form id="editForm"><h2 id="editTitle"></h2><p id="impact"></p>
    <div id="numberFields"><label id="numberLabel" for="number">学号</label><input id="number" maxlength="32" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>
    <div id="realNameFields" hidden><label for="realNameInput">真实姓名（选填）</label><input id="realNameInput" maxlength="40" autocomplete="off"></div>
    <ul class="target-list" id="editTargets" aria-label="此次操作的学号" hidden></ul>
    <p id="editError" class="notice error" role="alert"></p>
    <div class="dialog-actions"><button class="secondary" id="cancel" type="button">取消</button><button class="primary" id="save" type="submit">保存</button></div>
  </form>
</dialog>
<script src="./admin.js"></script>
</body>
</html>
